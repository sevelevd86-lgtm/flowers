<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141513">
<title>Цветы для тебя</title>
<style>
:root{--bg:#141513;--fg:#f1ece4;--mu:#9a968c;--ac:#f08fb4;--ln:#34372f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 60%,rgba(190,40,110,.28),rgba(0,0,0,0) 62%);animation:pl 9s ease-in-out infinite;pointer-events:none}
@keyframes pl{50%{opacity:.45;transform:scale(1.12)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
@keyframes shine{0%,60%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(220%) skewX(-20deg)}}
@keyframes glow{50%{box-shadow:0 0 14px rgba(240,143,180,.38)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@keyframes rp{to{transform:scale(1);opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes tg{50%{text-shadow:0 0 18px rgba(240,143,180,.55)}}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:22px 16px 0}
section{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}
.pg{animation:up .9s cubic-bezier(.25,.8,.25,1) both}
.rv{opacity:0;transform:translateY(10px) scale(.99);transition:opacity 1.1s cubic-bezier(.25,.8,.25,1),transform 1.1s cubic-bezier(.25,.8,.25,1)}
.rv.in{opacity:1;transform:none}
h1{font-weight:400;font-size:32px;margin:10px 0 6px;text-align:center;animation:tg 4s ease-in-out infinite}
h1 span{display:inline-block;animation:drop 1s cubic-bezier(.25,.8,.25,1) both}
p.s{color:var(--mu);margin:0 0 18px;text-align:center;font-size:15px;line-height:1.4;max-width:320px}
form{display:flex;gap:8px;width:100%}
input{flex:1;min-width:0;background:#1d1f1b;border:1px solid var(--ln);color:var(--fg);border-radius:12px;padding:13px 14px;font:inherit;font-size:17px;outline:none;transition:border-color .2s,box-shadow .2s,transform .2s}
input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(240,143,180,.18);transform:translateY(-1px)}
.shk{animation:shake .6s ease-in-out}
button,a.b{position:relative;overflow:hidden;background:var(--ac);color:#2a1019;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .4s cubic-bezier(.25,.8,.25,1),filter .4s,box-shadow .4s}
button:hover,a.b:hover{transform:translateY(-1px);filter:brightness(1.07);box-shadow:0 5px 16px rgba(240,143,180,.22)}
button:active,a.b:active{transform:scale(.97)}
.pr::after,a.b::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:shine 5.5s ease-in-out infinite}
.pr,a.b{animation:glow 4.5s ease-in-out infinite}
.g{background:#23251f!important;color:var(--fg)!important;border:1px solid var(--ln)!important}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:rp .9s ease-out forwards;pointer-events:none}
#bq,#deco{display:block;filter:drop-shadow(0 0 3px rgba(255,90,170,.55)) drop-shadow(0 0 14px rgba(255,60,150,.3));touch-action:none;cursor:grab}
#bq{width:min(100%,50vh);aspect-ratio:4/5}
#deco{width:100%;max-width:420px;height:min(360px,46vh);margin-top:auto}
#bq:active,#deco:active{cursor:grabbing}
.hint{color:var(--mu);font-size:13px;margin:2px 0 8px;animation:bob 2.4s ease-in-out infinite;transition:opacity .6s}
.hint.off{opacity:0}
#cap{text-align:center;opacity:0;transform:translateY(10px);transition:opacity 1.8s,transform 1.8s;margin:2px 0 14px;min-height:84px}
#cap.on{opacity:1;transform:none}
#to{display:block;font-style:italic;font-size:38px;color:var(--ac);margin-bottom:4px;min-height:46px}
#to.ty::after{content:"";display:inline-block;width:2px;height:.85em;background:var(--ac);margin-left:4px;animation:blink .7s infinite}
#sub{color:var(--mu);font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 22px}
.row.in>*{animation:pop .9s cubic-bezier(.25,.8,.25,1) backwards}
.row.in>*:nth-child(2){animation-delay:.15s}.row.in>*:nth-child(3){animation-delay:.3s}.row.in>*:nth-child(4){animation-delay:.45s}
.hid{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div id="app">
<section id="home" class="pg">
<h1 id="ttl">Цветы для тебя</h1>
<p class="s rv">Живой букет из символов. Напиши имя — и он вырастет сам.</p>
<form id="f" class="rv"><input id="nm" maxlength="28" placeholder="Имя, например Аня" autocomplete="off"><button class="pr">Собрать</button></form>
<p class="hint rv" style="margin-top:16px">↻ потяни цветок внизу, чтобы покрутить</p>
</section>
<section id="card" class="hid">
<canvas id="bq"></canvas>
<div class="hint">↔ потяни букет, чтобы покрутить</div>
<div id="cap"><span id="to"></span><span id="sub"></span></div>
<div class="row rv" id="own"><a class="b" id="tg" target="_blank" rel="noopener">Отправить в Telegram</a><button class="g" id="cp">Скопировать ссылку</button><button class="g" id="rr">Другой букет</button><button class="g" id="nw">Новое имя</button></div>
<div class="row rv" id="recv"><button class="pr" id="mine">Собрать свой букет</button></div>
</section>
<canvas id="deco"></canvas>
</div>
